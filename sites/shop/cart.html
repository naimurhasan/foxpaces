<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cart - Fox Shop</title>
  <script src="products.js"></script>
  <script src="cart.js"></script>
</head>
<body>
  <a href="index.html">Back to shop</a>
  <h1>Your cart</h1>
  <ul id="items"></ul>
  <p>Total: <span id="total"></span></p>
  <script>
    const lines = Object.entries(readCart()).map(([id, quantity]) => {
      const product = PRODUCTS.find((p) => p.id === id);
      return { product, quantity, cents: toCents(product.price) * quantity };
    });
    document.getElementById("items").innerHTML = lines
      .map((line) => `<li>${line.quantity} x ${line.product.name}: ${formatCents(line.cents)}</li>`)
      .join("") || "<li>Your cart is empty.</li>";
    document.getElementById("total").textContent =
      formatCents(lines.reduce((sum, line) => sum + line.cents, 0));
  </script>
</body>
</html>
