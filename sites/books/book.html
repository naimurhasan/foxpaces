<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Book - Fox Books</title>
  <script src="books.js"></script>
</head>
<body>
  <a href="index.html">Back to catalog</a>
  <h1 id="title">Not found</h1>
  <p>Author: <span id="author"></span></p>
  <p>Published: <span id="year"></span></p>
  <script>
    const id = Number(new URLSearchParams(location.search).get("id"));
    const book = BOOKS.find((b) => b.id === id);
    if (book) {
      document.getElementById("title").textContent = book.title;
      document.getElementById("author").textContent = book.author;
      document.getElementById("year").textContent = book.year;
      document.title = `${book.title} - Fox Books`;
    }
  </script>
</body>
</html>
