[project]
name = "foxpaces"
version = "0.1.0"
description = "A reproducible benchmark for LLM browser agents driving Camoufox."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "camoufox>=0.5.9",
]

[project.scripts]
foxpaces = "foxpaces.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/foxpaces/observation.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: launches a real Camoufox browser"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
